[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme", "hatch-requirements-txt",
            "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.vcs]
version-file = "_version.py"

[project]
name = "git-project"
dynamic = ["dependencies", "readme", "version"]
description = "The extensible stupid project manager"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "David A. Greene", email = "dag@obbligato.org" },
]
keywords = [
    "development",
    "git",
    "project",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-console-scripts",
    "setuptools",
]

[project.scripts]
git-project = "git_project.main:main"

[project.urls]
Documentation = "https://github.com/greened/git-project#readme"
Issues = "https://github.com/greened/git-project/issues"
Source = "https://github.com/greened/git-project"

[tool.hatch.version]
source = "vcs"

[tool.hatch.envs.default]
dependencies = [
  # Provides the "git-project.plugins" entry points the CLI tests dispatch
  # through; without them argparse offers an empty subcommand list.
  "git-project-core-plugins",
  "coverage[toml]>=6.5",
  "pytest",
  "pytest-console-scripts",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "coverage run -m pytest {args:tests}"
cov-report = [
  "- coverage combine",
  "coverage report",
]
cov = [
  "test-cov",
  "cov-report",
]

[[tool.hatch.envs.all.matrix]]
python = ["3.10", "3.11"]

[tool.hatch.envs.lint]
# Not detached: mypy reads the types of the installed dependencies.
dependencies = [
  "black==26.5.1",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.8",
]
[tool.hatch.envs.lint.scripts]
typing = "mypy {args:src/git_project tests}"
style = [
  "ruff check {args:.}",
  "black --check --diff {args:.}",
]
fmt = [
  "black {args:.}",
  "ruff check --fix {args:.}",
  "style",
]
all = [
  "style",
  "typing",
]

[tool.hatch.envs.docs]
# NOT detached: autodoc imports the package, because docs/intro.rst pulls the
# module docstring in with automodule rather than keeping a second copy. A
# detached env would build with the package absent and the directive would fail.
dependencies = [
  "sphinx>=7",
]
[tool.hatch.envs.docs.scripts]
build = "sphinx-build -M html docs docs/_build -W --keep-going"
clean = "sphinx-build -M clean docs docs/_build"

[tool.black]
target-version = ["py310"]
line-length = 79

[tool.ruff]
target-version = "py310"
line-length = 79

[tool.ruff.lint]
select = [
  "A",
  "B",
  "C4",
  "DTZ",
  "E",
  "F",
  "I",
  "ISC",
  "N",
  "PLE",
  "PLW",
  "RUF",
  "UP",
  "W",
]
ignore = [
  # Allow non-abstract empty methods in abstract base classes
  "B027",
  # black sets the line length
  "E501",
]
unfixable = [
  # Don't touch unused imports
  "F401",
]

[tool.ruff.lint.isort]
known-first-party = ["git_project"]

[tool.coverage.run]
source_pkgs = ["git-project", "tests"]
branch = true
parallel = true
omit = [
  "src/git_project/__about__.py",
]

[tool.coverage.paths]
git-project = ["src/git_project", "*/git-project/src/git_project"]
tests = ["tests", "*/git-project/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.hatch.metadata.hooks.vcs]
Homepage = "https://github.com/greened/git-project#readme"
source_archive = "https://github.com/greened/git-project/archive/{commit_hash}.zip"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/x-rst"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "src/git_project/__init__.py"
start-after = "\"\"\""
end-before = "-------"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
text = """

-------

.. contents:: Table of Contents

"""

# The rest of the module docstring: everything past the badges. Without this
# the description stopped at the separator above, so Installation and the whole
# body were never published. The docstring is the single source; docs/intro.rst
# pulls the same text in with automodule.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "src/git_project/__init__.py"
start-after = "-------\n"
end-before = "\"\"\""

# Fragments are concatenated verbatim and the docstring ends in an indented
# block, so without a blank line the next fragment unindents into it. That is an
# RST error and PyPI rejects a description that fails to render.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
text = "\n"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "docs/authors.rst"
end-before = "A full list of contributors"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
text = "\n"

# The newest release section. It ends at the next release heading or at the
# link targets.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "docs/changelog.rst"
pattern = '\n(`\d+\.\d+\.\d+`_ - .+?\n)\n*(?:`\d+\.\d+\.\d+`_ - |\.\. _)'

# The heading is a link reference. Its target must move with it, or the
# description does not render.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "docs/changelog.rst"
pattern = '\n(\n\.\. _\S+: .*)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
text = """

`Full Changelog <https://github.com/greened/git-project/blob/master/docs/changelog.rst>`_
"""

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.build.targets.wheel]
packages = [
    "/src/git_project",
]
